plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'java-library'
    id 'idea'
    id 'org.spongepowered.mixin' version '0.7.+'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

println "Java: ${providers.systemProperty('java.version').get()}, " +
        "JVM: ${providers.systemProperty('java.vm.version').get()} (${providers.systemProperty('java.vendor').get()}), " +
        "Arch: ${providers.systemProperty('os.arch').get()}"

minecraft {
    mappings channel: 'official', version: minecraft_version

    accessTransformer = file("${rootProject.projectDir}/common/src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'eventbus.api.strictRuntimeChecks', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods { tickweave { source sourceSets.main } }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'eventbus.api.strictRuntimeChecks', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods { tickweave { source sourceSets.main } }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources'), '--existing', file('src/main/resources')
        }
    }
}

repositories {
    maven { name = 'Bawnorton'; url = 'https://maven.bawnorton.com/releases' }
    mavenCentral()
    mavenLocal()
}

dependencies {
    // 1. Core
    minecraft "net.minecraftforge:forge:$minecraft_version-$forge_version"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    // 2. Mixin Extras & Squared
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }

    // compileOnly("com.github.bawnorton.mixinsquared:mixinsquared-forge:0.1.1")
    // compileOnly("com.github.bawnorton.mixinsquared:mixinsquared-common:0.1.1")
    // annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.1.1")

    // 3. Utilities (Lombok)
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // 4. Optional: Harium for navigation integration
    compileOnly files("../common/libs/Harium-1.0.0.jar")

    // Dedicated servers do not provide the LWJGL core required by Vulkan's module descriptor.
    implementation(jarJar("org.lwjgl:lwjgl:3.3.1")) {
        jarJar.ranged(it, "[3.3.1,3.4.0)")
    }
    implementation(jarJar("org.lwjgl:lwjgl-vulkan:3.3.1")) {
        jarJar.ranged(it, "[3.3.1,3.4.0)")
    }
}

mixin {
    add sourceSets.main, 'tickweave.refmap.json'
    config 'tickweave.common.mixins.json'
    config 'tickweave.forge.mixins.json'
}

jarJar.enable()
tasks.named('jarJar').configure {
    from(rootProject.file('LICENSE'))
    manifest.attributes('MixinConfigs': 'tickweave.common.mixins.json,tickweave.forge.mixins.json')
}
reobf { jarJar {} }
tasks.named('jarJar').configure { finalizedBy 'reobfJarJar' }

sourceSets.main.resources { srcDir 'src/generated/resources' }

// FG6 automatically creates the reobfJar task for SRG reobfuscation
jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
}

idea.module { downloadJavadoc = downloadSources = true }

layout.buildDirectory.set(file("build"))
