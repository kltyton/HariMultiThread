name: Build TickWeave
on:
  push: {}
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Forge and Fabric
        run: |
          chmod +x gradlew
          ./gradlew :forge:build :fabric:build --stacktrace
      - name: Prepare release artifacts
        run: |
          mkdir jars
          cp forge/build/libs/*-all.jar jars/
          find fabric/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} jars/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: tickweave-1.20.1
          path: jars/*.jar
          if-no-files-found: error
